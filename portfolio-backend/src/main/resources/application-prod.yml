server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

spring:
  application:
    name: portfolio-backend
  datasource:
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}}}
    username: ${DATABASE_USERNAME:${DB_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:/var/data/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yourportfolio.com,https://admin.yourportfolio.com}
  contact:
    notification-email: ${CONTACT_NOTIFICATION_EMAIL:admin@portfolio.local}
  admin:
    seed: ${SEED_ADMIN:false}
    default-email: ${ADMIN_EMAIL:admin@portfolio.local}
    default-password: ${ADMIN_PASSWORD:Admin@123456}
    default-username: ${ADMIN_USERNAME:admin}

logging:
  level:
    root: INFO
    com.portfolio: INFO
